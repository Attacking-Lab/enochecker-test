when:
  - event: push
    branch: main
  - event: pull_request
    branch: main

matrix:
  PYTHON_VERSION:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

environment:
  UV_FLAGS: "--exact --isolated --frozen"

steps:
  - name: format
    image: python:${PYTHON_VERSION}
    commands:
      - apt-get update -y && apt-get install -y make
      - python -m pip install uv==0.8.5
      - make --trace format

  - name: lint
    image: python:${PYTHON_VERSION}
    commands:
      - apt-get update -y && apt-get install -y make
      - python -m pip install uv==0.8.5
      - make --trace lint

  - name: mypy
    image: python:${PYTHON_VERSION}
    commands:
      - apt-get update -y && apt-get install -y make
      - python -m pip install uv==0.8.5
      - make --trace mypy

  - name: test
    image: python:${PYTHON_VERSION}
    commands:
      - apt-get update -y && apt-get install -y make
      - python -m pip install uv==0.8.5
      - make --trace test

  - name: build
    image: python:${PYTHON_VERSION}
    commands:
      - apt-get update -y && apt-get install -y make
      - python -m pip install uv==0.8.5
      - make --trace build
      - pip install dist/enochecker_test-*.tar.gz
