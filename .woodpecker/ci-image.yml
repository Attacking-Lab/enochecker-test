# Builds and pushes .woodpecker/Dockerfile, split into its own
# workflow from test.yml so it isn't tied to test.yml's own
# triggers/steps -- mirrors atklab/enochecker3's
# .woodpecker/ci-image.yml split. Only runs when the Dockerfile
# changed (`when.path`); test.yml declares a workflow-level
# `depends_on: [ci-image]` (optional: true) so it still runs when this
# workflow is skipped, and `pull: true` on its own steps so a run that
# *did* rebuild the image picks up the fresh :latest instead of a
# stale cached copy.
#
# Uses the woodpeckerci/plugin-docker-buildx plugin (rather than
# hand-rolled docker:dind build+push commands) to build+push the CI
# image, matching atklab/enochecker-cli/atklab/gameserver -- it
# authenticates itself via explicit REGISTRY_USERNAME/REGISTRY_PASSWORD
# secrets rather than a project-level registry setting.

when:
  - event: [push, pull_request, manual, tag]
    path: .woodpecker/Dockerfile

steps:
  - name: ci-image
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: oci.atklab.cloud
      repo: oci.atklab.cloud/enochecker-test/enochecker-test-ci
      dockerfile: .woodpecker/Dockerfile
      tags: latest
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
